<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快搜搜题（Cloudflare 版）</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f7fb; color: #1a2233; }
.container { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 12px 0 4px; }
.sub { color: #667; font-size: 13px; margin-bottom: 16px; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,40,80,.08); }
.card h2 { font-size: 15px; margin: 0 0 10px; color: #334; }
.drop { border: 2px dashed #b8c4e0; border-radius: 12px; padding: 22px; text-align: center; color: #5a6b8c; cursor: pointer; }
.drop:hover { border-color: #4f6ef7; }
.drop img { max-width: 100%; border-radius: 8px; display: block; margin: 8px auto; }
button { background: #4f6ef7; border: 0; color: #fff; padding: 9px 16px; border-radius: 9px; font-size: 13px; cursor: pointer; }
button:disabled { opacity: .5; }
button.ghost { background: #eef1fb; color: #4f6ef7; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
pre { background: #0f1524; color: #d7e0ff; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; min-height: 44px; margin-top: 10px; }
.result { border-left: 4px solid #4f6ef7; padding: 10px 12px; margin-top: 10px; background: #f8f9ff; border-radius: 8px; font-size: 14px; }
.result .q { font-weight: 600; }
.result .a { color: #127a3d; margin-top: 4px; }
.result .e { color: #556; margin-top: 4px; font-size: 13px; }
.result .meta { color: #889; font-size: 12px; margin-top: 6px; }
.tag { display: inline-block; background: #eef1fb; color: #4f6ef7; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
.banner { font-size: 12px; color: #68530a; background: #fdf6e3; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
textarea { width: 100%; border: 1px solid #d5dcef; border-radius: 10px; padding: 10px; font-size: 13px; min-height: 80px; }
.err { color: #c33; font-size: 13px; margin-top: 8px; }
small { color: #889; }
</style>
</head>
<body>
<div class="container">
  <h1>📷 快搜搜题 · Cloudflare 版</h1>
  <div class="sub">拍照 → Workers AI OCR → 本地题库检索 / AI 解题（全部走 Cloudflare 免费额度）</div>

  <div class="card">
    <h2>① 拍照 / 实时识别</h2>
    <video id="video" playsinline autoplay muted hidden style="width:100%; border-radius:10px; display:block; margin:8px auto; max-height:300px;"></video>
    <div class="row">
      <button class="ghost" id="liveBtn" onclick="toggleLive()">🔴 开启实时识别</button>
      <button id="ocrBtn" disabled onclick="runOcr()">识别一帧（Workers AI OCR）</button>
      <small>模型：<select id="ocrModel" onchange="if(live) restartLive()"><option value="hanzi">中文(汉字)</option><option value="latin">西文</option></select></small>
    </div>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <div>或点我 <b>手动选图 / 拍照</b>（移动端会调起相机）</div>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
      <img id="preview" hidden>
    </div>
    <pre id="liveText" hidden></pre>
    <pre id="ocrText" hidden></pre>
  </div>

  <div class="card">
    <h2>② 搜题</h2>
    <textarea id="query" placeholder="粘贴 / 手动输入题目，或用上方 OCR 结果自动填入"></textarea>
    <div class="row">
      <button class="ghost" onclick="runSearch()">搜本地题库</button>
      <button class="ghost" onclick="runAsk()">🤖 AI 解题（Llama 3.1 · CF AI）</button>
      <button class="ghost" onclick="refreshBanks()">刷新题库</button>
    </div>
    <div id="results"></div>
    <div class="banner" id="bankInfo"></div>
  </div>

  <div class="card">
    <h2>③ 题库导入（AI 导题位）</h2>
    <textarea id="bankText" placeholder="粘贴题目，空行分隔。格式：&#10;题目文本&#10;答案: xx&#10;解析: xx"></textarea>
    <div class="row">
      <input id="bankName" placeholder="题库名" style="border:1px solid #d5dcef; border-radius:9px; padding:8px; min-width:110px;">
      <button class="ghost" onclick="importBank()">导入题库</button>
    </div>
    <div class="err" id="bankMsg"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; };

$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  $("preview").src = URL.createObjectURL(f);
  $("preview").hidden = false;
  $("ocrBtn").disabled = false;
};

/* ---------- 实时识别：摄像头流 + 定时抓帧 OCR ---------- */
let live = false, liveTimer = null, liveBusy = false, lastLiveText = "";

async function toggleLive() {
  if (live) return stopLive();
  const video = $("video");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    video.hidden = false;
    await video.play();
  } catch (e) { alert("无法开启相机：" + e.message); return; }
  live = true;
  $("liveBtn").textContent = "⏹ 停止实时识别";
  $("liveText").hidden = false;
  $("results").insertAdjacentHTML("afterbegin", "<div class='banner'>实时模式：识别到文字会自动搜索题库（不耗 AI 额度）；确认题目后手动点 AI 解题。</div>");
  liveLoop();
}

async function liveLoop() {
  if (!live) return;
  liveTimer = setTimeout(async () => {
    if (!live) return;
    if (!liveBusy) {
      liveBusy = true;
      try {
        const v = $("video");
        if (v.videoWidth) {
          const canvas = document.createElement("canvas");
          const w = Math.min(720, v.videoWidth);
          const h = Math.round(v.videoHeight * (w / v.videoWidth));
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(v, 0, 0, w, h);
          const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.8));
          const resp = await fetch(`/api/ocr?model=${$("ocrModel").value}`, { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } });
          const r2 = await resp.json();
          if (r2.ok && r2.text.trim() && r2.text !== lastLiveText) {
            lastLiveText = r2.text;
            $("liveText").textContent = "👀 识别中…";
            $("liveText").textContent = "📖 " + r2.text;
            await autoSearch(r2.text);
          }
        }
      } catch (_) {}
      liveBusy = false;
    }
    liveLoop();
  }, 2500); // 每 2.5s 一帧
}

function restartLive() {
  clearTimeout(liveTimer);
  liveLoop();
}

function stopLive() {
  live = false;
  clearTimeout(liveTimer);
  const video = $("video");
  video.srcObject?.getTracks().forEach(t => t.stop());
  video.hidden = true; video.srcObject = null;
  $("liveBtn").textContent = "🔴 开启实时识别";
}

/* 实时模式下的自动题库检索（本地计算，免费） */
let autoTimer = null;
async function autoSearch(text) {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(async () => {
    $("query").value = text;
    const r = await (await fetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: text })
    })).json();
    const box = $("results");
    if (r.ok && r.results.length) {
      box.innerHTML = '<div class="banner" style="color:#127a3d;background:#eefaf1">✅ 实时匹配到：</div>' +
        r.results.slice(0, 1).map(x => `
        <div class="result">
          <div class="q">${esc(x.question)} <span class="tag">匹配 ${(x.score*100).toFixed(0)}%</span></div>
          ${x.options ? `<div>${esc(x.options)}</div>` : ""}
          ${x.answer ? `<div class="a">答案：${esc(x.answer)}</div>` : ""}
          ${x.explanation ? `<div class="e">${esc(x.explanation)}</div>` : ""}
          <div class="meta">题库：${esc(x.bank)}</div>
        </div>`).join("");
    } else if (r.ok) {
      box.innerHTML = '<div class="banner">没有匹配到本地题库。把题目稳住别动，确认文字无误后点下方「AI 解题」。</div>';
    }
  }, 800);
}

async function runOcr() {
  const src = $("liveBtn").textContent.includes("开启") ? $("file").files[0] : null;
  let body, headers;
  if (src) {
    body = src; headers = { "Content-Type": "image/png" };
  } else {
    const v = $("video");
    const c = document.createElement("canvas");
    c.width = Math.min(720, v.videoWidth); c.height = Math.round(v.videoHeight * (c.width / v.videoWidth));
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    body = blob; headers = { "Content-Type": "image/jpeg" };
  }
  $("ocrBtn").disabled = true;
  try {
    const r = await (await fetch(`/api/ocr?model=${$("ocrModel").value}`, { method: "POST", body, headers })).json();
    if (!r.ok) throw new Error(r.error);
    $("ocrText").hidden = false;
    $("ocrText").textContent = r.text || "(未识别到文字)";
    $("query").value = r.text;
  } catch (e) { alert(e.message || e); }
  $("ocrBtn").disabled = false;
}

async function runSearch() {
  const r = await (await fetch("/api/search", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query: $("query").value.trim() })
  })).json();
  const box = $("results");
  if (!r.ok) { box.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  if (!r.results.length) { box.innerHTML = "<div class='err'>本地题库没搜到相似题。可先导入题库（第③步），或用 AI 解题。</div>"; return; }
  box.innerHTML = r.results.map(x => `
    <div class="result">
      <div class="q">${esc(x.question)} <span class="tag">匹配 ${(x.score*100).toFixed(0)}%</span></div>
      ${x.options ? `<div>${esc(x.options)}</div>` : ""}
      ${x.answer ? `<div class="a">答案：${esc(x.answer)}</div>` : ""}
      ${x.explanation ? `<div class="e">${esc(x.explanation)}</div>` : ""}
      <div class="meta">题库：${esc(x.bank)}</div>
    </div>`).join("");
}

async function runAsk() {
  const q = $("query").value.trim();
  if (!q) return;
  const msg = document.createElement("div");
  msg.className = "err"; msg.textContent = "AI 正在解题…";
  $("results").appendChild(msg);
  const r = await (await fetch("/api/ask", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: q })
  })).json();
  msg.remove();
  const box = $("results");
  if (!r.ok) { box.innerHTML += `<div class="err">AI：${esc(r.error)}</div>`; return; }
  box.innerHTML += `<div class="result"><div class="q">🤖 ${esc(r.model)}</div><div class="a">${esc(r.answer).replace(/\n/g, "<br>")}</div></div>`;
}

async function importBank() {
  const msg = $("bankMsg"); msg.textContent = "";
  const r = await (await fetch("/api/bank", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: $("bankName").value.trim(), text: $("bankText").value })
  })).json();
  msg.textContent = r.ok ? `✅ 已导入「${r.name}」共 ${r.count} 题` : "❌ " + r.error;
  if (r.ok) { $("bankText").value = ""; $("bankName").value = ""; refreshBanks(); }
}

function refreshBanks() {
  fetch("/api/banks").then(x => x.json()).then(d => {
    $("bankInfo").textContent = "当前题库：" + (d.banks.map(b => `${b.name}(${b.count})`).join("、") || "无");
  });
}
refreshBanks();
</script>
</body>
</html>
