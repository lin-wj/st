<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快搜搜题（复刻版）</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f7fb; color: #1a2233; }
.container { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 12px 0 4px; }
.sub { color: #667; font-size: 13px; margin-bottom: 16px; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(20,40,80,.08); }
.card h2 { font-size: 15px; margin: 0 0 10px; color: #334; }
.drop { border: 2px dashed #b8c4e0; border-radius: 12px; padding: 22px; text-align: center; color: #5a6b8c; cursor: pointer; position: relative; }
.drop:hover { border-color: #4f6ef7; }
.drop img { max-width: 100%; border-radius: 8px; display: block; margin: 8px auto; }
button { background: #4f6ef7; border: 0; color: #fff; padding: 9px 16px; border-radius: 9px; font-size: 13px; cursor: pointer; }
button:disabled { opacity: .5; }
button.ghost { background: #eef1fb; color: #4f6ef7; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
pre { background: #0f1524; color: #d7e0ff; padding: 12px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; min-height: 44px; }
.result { border-left: 4px solid #4f6ef7; padding: 10px 12px; margin-top: 10px; background: #f8f9ff; border-radius: 8px; font-size: 14px; }
.result .q { font-weight: 600; }
.result .a { color: #127a3d; margin-top: 4px; }
.result .e { color: #556; margin-top: 4px; font-size: 13px; }
.result .meta { color: #889; font-size: 12px; margin-top: 6px; }
.tag { display: inline-block; background: #eef1fb; color: #4f6ef7; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
.banner { font-size: 12px; color: #9a6; background: #f2f8ee; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
textarea { width: 100%; border: 1px solid #d5dcef; border-radius: 10px; padding: 10px; font-size: 13px; min-height: 80px; }
input[type=file] { font-size: 13px; }
.err { color: #c33; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>📷 快搜搜题 · 复刻版</h1>
  <div class="sub">拍照 → 本地 OCR → 本地题库检索（复刻自 快搜搜题 3.9.7 逆向结论）</div>

  <div class="card">
    <h2>① 拍照 / 传图</h2>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <div>点我选图，或直接用 <b>摄像头拍照</b>（移动端）<br><small>支持粘贴 / 拖入截图</small></div>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
      <img id="preview" hidden>
    </div>
    <div class="row"><button id="ocrBtn" disabled onclick="runOcr()">识别文字（本地 OCR）</button></div>
    <pre id="ocrText" hidden></pre>
  </div>

  <div class="card">
    <h2>② 搜题</h2>
    <textarea id="query" placeholder="粘贴 / 手动输入题目，或用上方 OCR 结果自动填入"></textarea>
    <div class="row">
      <button class="ghost" onclick="runSearch()">搜本地题库</button>
      <button class="ghost" onclick="runAsk()">AI 解题（需配置 LLM_API_KEY）</button>
    </div>
    <div id="results"></div>
    <div class="banner" id="bankInfo"></div>
  </div>

  <div class="card">
    <h2>③ 题库导入</h2>
    <div class="row">
      <input type="file" id="bankFile" accept=".json">
      <input id="bankName" placeholder="题库名（如 高一数学）" style="flex:1; min-width:120px; border:1px solid #d5dcef; border-radius:9px; padding:8px;">
      <button class="ghost" onclick="importBank()">导入</button>
    </div>
    <div class="err" id="bankMsg"></div>
  </div>
</div>

<script>
let currentOcr = "";
const $ = id => document.getElementById(id);

$("file").onchange = async () => {
  const f = $("file").files[0];
  if (!f) return;
  $("preview").src = URL.createObjectURL(f);
  $("preview").hidden = false;
  $("ocrBtn").disabled = false;
};
async function runOcr() {
  const f = $("file").files[0];
  const fd = new FormData(); fd.append("image", f);
  $("ocrBtn").disabled = true;
  try {
    const r = await (await fetch("/api/ocr", {method:"POST", body: fd})).json();
    if (!r.ok) throw new Error(r.error);
    currentOcr = r.text;
    $("ocrText").hidden = false;
    $("ocrText").textContent = r.text || "(未识别到文字)";
    $("query").value = r.text;
  } catch(e) { alert(e.message); }
  $("ocrBtn").disabled = false;
}
async function runSearch() {
  const r = await (await fetch("/api/search", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({query: $("query").value.trim()})})).json();
  const box = $("results");
  if (!r.ok) { box.innerHTML = `<div class="err">${r.error}</div>`; return; }
  if (!r.results.length) { box.innerHTML = "<div class='err'>本地题库没搜到相似题。可先导入题库（第③步），或试 AI 解题。</div>"; return; }
  box.innerHTML = r.results.map(x => `
    <div class="result">
      <div class="q">${esc(x.question)} <span class="tag">${(x.score*100).toFixed(0)}%</span></div>
      ${x.options ? `<div>${esc(x.options)}</div>` : ""}
      ${x.answer ? `<div class="a">答案：${esc(x.answer)}</div>` : ""}
      ${x.explanation ? `<div class="e">${esc(x.explanation)}</div>` : ""}
      <div class="meta">题库：${esc(x.bank)}</div>
    </div>`).join("");
}
async function runAsk() {
  const r = await (await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({query: $("query").value.trim()})})).json();
  const box = $("results");
  if (!r.ok) { box.innerHTML += `<div class="err">AI：${r.error}</div>`; return; }
  box.innerHTML += `<div class="result"><div class="q">🤖 ${esc(r.model)}</div><div class="a">${esc(r.answer).replace(/\n/g,"<br>")}</div></div>`;
}
async function importBank() {
  const msg = $("bankMsg"); msg.textContent = "";
  const f = $("bankFile").files[0];
  const fd = new FormData();
  if (f) fd.append("file", f);
  fd.append("name", $("bankName").value);
  const r = await (await fetch("/api/bank", {method:"POST", body: fd})).json();
  msg.textContent = r.ok ? `✅ 已导入「${r.name}」共 ${r.count} 题` : "❌ " + r.error;
  refreshBanks();
}
function refreshBanks() {
  fetch("/api/banks").then(x=>x.json()).then(d => {
    $("bankInfo").textContent = "当前本地题库：" + (d.banks.map(b => `${b.name}(${b.count})`).join("、") || "无，请先导入");
  });
}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}
refreshBanks();
</script>
</body>
</html>
